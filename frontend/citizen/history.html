<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>سجل البلاغات | Emergency Response</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/app.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Cairo", sans-serif;
            background: #07111f;
            color: #f8fafc;
        }

        .history-page {
            min-height: 100vh;
        }

        /* =========================
           TOP BAR
        ========================= */

        .history-topbar {
            height: 72px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            display: flex;
            align-items: center;
            background: rgba(7,17,31,.95);
        }

        .history-topbar-inner {
            width: min(1100px, 92%);
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .history-brand {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 15px;
            font-weight: 700;
        }

        .brand-mark {
            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: #dc2626;
            color: white;

            font-size: 12px;
            font-weight: 800;
        }

        .home-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 12px;
        }

        .home-link:hover {
            color: white;
        }

        /* =========================
           MAIN
        ========================= */

        .history-main {
            width: min(1000px, 92%);
            margin: auto;

            padding: 45px 0 70px;
        }

        .history-heading {
            margin-bottom: 28px;
        }

        .heading-label {
            color: #64748b;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .history-heading h1 {
            margin: 0;

            font-size: clamp(27px, 4vw, 36px);
            font-weight: 800;
        }

        .history-heading p {
            margin: 8px 0 0;

            color: #94a3b8;
            font-size: 13px;
        }

        /* =========================
           FILTERS
        ========================= */

        .history-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 18px;
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-box input {
            width: 100%;

            min-height: 44px;

            padding: 0 16px;

            border-radius: 11px;

            border: 1px solid rgba(255,255,255,.08);

            background: rgba(255,255,255,.035);

            color: #e2e8f0;

            outline: none;

            font-family: inherit;
            font-size: 12px;
        }

        .search-box input:focus {
            border-color: rgba(96,165,250,.35);
        }

        .filter-select {
            min-height: 44px;

            padding: 0 13px;

            border-radius: 11px;

            border: 1px solid rgba(255,255,255,.08);

            background: #0d1a2b;

            color: #cbd5e1;

            outline: none;

            font-family: inherit;
            font-size: 11px;
        }

        /* =========================
           STATS
        ========================= */

        .history-stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-bottom: 20px;
        }

        .stat-card {
            padding: 17px;

            border-radius: 14px;

            background: rgba(255,255,255,.035);

            border: 1px solid rgba(255,255,255,.07);
        }

        .stat-label {
            color: #64748b;
            font-size: 10px;
        }

        .stat-value {
            margin-top: 4px;

            font-size: 23px;
            font-weight: 800;
        }

        .stat-value.active {
            color: #60a5fa;
        }

        .stat-value.resolved {
            color: #4ade80;
        }

        .stat-value.total {
            color: #e2e8f0;
        }

        /* =========================
           REPORT LIST
        ========================= */

        .reports-list {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .report-card {
            display: grid;

            grid-template-columns:
                auto
                minmax(0, 1fr)
                auto;

            align-items: center;

            gap: 15px;

            padding: 18px;

            border-radius: 15px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.025)
                );

            border: 1px solid rgba(255,255,255,.07);

            transition: .2s ease;
        }

        .report-card:hover {
            border-color: rgba(255,255,255,.14);

            transform: translateY(-1px);
        }

        .report-icon {
            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background: rgba(220,38,38,.09);

            color: #f87171;

            font-size: 18px;
            font-weight: 800;
        }

        .report-main {
            min-width: 0;
        }

        .report-top {
            display: flex;

            align-items: center;

            gap: 9px;

            flex-wrap: wrap;
        }

        .report-type {
            font-size: 14px;
            font-weight: 800;
        }

        .report-id {
            color: #64748b;

            font-size: 10px;

            direction: ltr;

            display: inline-block;
        }

        .report-description {
            margin-top: 4px;

            color: #94a3b8;

            font-size: 11px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .report-date {
            margin-top: 5px;

            color: #475569;

            font-size: 9px;
        }

        /* =========================
           BADGES
        ========================= */

        .report-meta {
            display: flex;

            flex-direction: column;

            align-items: flex-end;

            gap: 7px;
        }

        .status-badge,
        .priority-badge {
            padding: 5px 9px;

            border-radius: 7px;

            font-size: 9px;

            font-weight: 700;

            white-space: nowrap;
        }

        .status-active,
        .status-dispatched {
            background: rgba(59,130,246,.1);
            color: #60a5fa;
        }

        .status-resolved {
            background: rgba(34,197,94,.09);
            color: #4ade80;
        }

        .status-processing {
            background: rgba(245,158,11,.09);
            color: #fbbf24;
        }

        .priority-critical {
            background: rgba(220,38,38,.1);
            color: #f87171;
        }

        .priority-high {
            background: rgba(249,115,22,.1);
            color: #fb923c;
        }

        .priority-medium {
            background: rgba(245,158,11,.1);
            color: #fbbf24;
        }

        .priority-low {
            background: rgba(34,197,94,.08);
            color: #4ade80;
        }

        /* =========================
           ACTIONS
        ========================= */

        .report-actions {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .report-btn {
            min-width: 95px;

            min-height: 34px;

            padding: 0 11px;

            border-radius: 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            font-family: inherit;
            font-size: 9px;
            font-weight: 700;

            cursor: pointer;
        }

        .details-btn {
            background: rgba(255,255,255,.05);

            border: 1px solid rgba(255,255,255,.08);

            color: #cbd5e1;
        }

        .track-btn {
            background: #dc2626;

            color: white;
        }

        .track-btn:hover {
            background: #ef4444;
        }

        /* =========================
           EMPTY STATE
        ========================= */

        .empty-state {
            display: none;

            padding: 55px 20px;

            text-align: center;

            border-radius: 16px;

            border: 1px dashed rgba(255,255,255,.1);

            background: rgba(255,255,255,.02);
        }

        .empty-icon {
            width: 55px;
            height: 55px;

            margin: auto auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: rgba(255,255,255,.04);

            color: #64748b;

            font-size: 20px;
        }

        .empty-state h3 {
            margin: 0;

            font-size: 15px;
        }

        .empty-state p {
            margin: 6px 0 18px;

            color: #64748b;

            font-size: 11px;
        }

        .new-report {
            display: inline-flex;

            min-height: 42px;

            padding: 0 17px;

            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: #dc2626;

            color: white;

            text-decoration: none;

            font-size: 11px;

            font-weight: 700;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .history-main {
                padding-top: 30px;
            }

            .history-toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .history-stats {
                grid-template-columns: 1fr 1fr;
            }

            .history-stats
            .stat-card:last-child {
                grid-column: 1 / -1;
            }

            .report-card {
                grid-template-columns:
                    auto
                    minmax(0, 1fr);
            }

            .report-meta {
                grid-column: 2;
                align-items: flex-start;

                flex-direction: row;
            }

            .report-actions {
                grid-column: 1 / -1;

                flex-direction: row;
            }

            .report-btn {
                flex: 1;
            }

        }

        @media (max-width: 450px) {

            .history-stats {
                grid-template-columns: 1fr;
            }

            .history-stats
            .stat-card:last-child {
                grid-column: auto;
            }

            .report-card {
                grid-template-columns: 1fr;
            }

            .report-icon {
                width: 44px;
                height: 44px;
            }

            .report-meta,
            .report-actions {
                grid-column: auto;
            }

            .report-meta {
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


<div class="history-page">


    <!-- =========================================
         TOP BAR
    ========================================== -->

    <header class="history-topbar">

        <div class="history-topbar-inner">

            <div class="history-brand">

                <span class="brand-mark">
                    ER
                </span>

                <span>
                    Emergency Response
                </span>

            </div>

            <a
                href="../index.html"
                class="home-link"
            >
                الرئيسية ←
            </a>

        </div>

    </header>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="history-main">


        <!-- HEADER -->

        <section class="history-heading">

            <div class="heading-label">
                حساب المواطن
            </div>

            <h1>
                سجل البلاغات
            </h1>

            <p>
                جميع الحالات التي تم الإبلاغ عنها من خلال النظام.
            </p>

        </section>



        <!-- =====================================
             STATS
        ====================================== -->

        <section class="history-stats">


            <div class="stat-card">

                <div class="stat-label">
                    إجمالي البلاغات
                </div>

                <div
                    class="stat-value total"
                    id="totalReports"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    البلاغات النشطة
                </div>

                <div
                    class="stat-value active"
                    id="activeReports"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    البلاغات المكتملة
                </div>

                <div
                    class="stat-value resolved"
                    id="resolvedReports"
                >
                    0
                </div>

            </div>

        </section>



        <!-- =====================================
             TOOLBAR
        ====================================== -->

        <section class="history-toolbar">


            <div class="search-box">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="ابحث برقم البلاغ أو نوع الحالة..."
                >

            </div>


            <select
                class="filter-select"
                id="statusFilter"
            >

                <option value="all">
                    جميع الحالات
                </option>

                <option value="active">
                    نشطة
                </option>

                <option value="dispatched">
                    تم توجيه الفريق
                </option>

                <option value="resolved">
                    مكتملة
                </option>

                <option value="processing">
                    قيد المعالجة
                </option>

            </select>

        </section>



        <!-- =====================================
             REPORTS
        ====================================== -->

        <section
            class="reports-list"
            id="reportsList"
        ></section>



        <!-- EMPTY -->

        <section
            class="empty-state"
            id="emptyState"
        >

            <div class="empty-icon">
                —
            </div>

            <h3>
                لا توجد بلاغات
            </h3>

            <p>
                لم يتم العثور على بلاغات مطابقة للبحث.
            </p>

            <a
                href="report.html"
                class="new-report"
            >
                إرسال بلاغ جديد
            </a>

        </section>

    </main>

</div>



<script src="../js/app.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    async () => {


        /* =====================================
           ELEMENTS
        ====================================== */

        const reportsList =
            document.getElementById(
                "reportsList"
            );

        const emptyState =
            document.getElementById(
                "emptyState"
            );

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        const statusFilter =
            document.getElementById(
                "statusFilter"
            );



        /* =====================================
           LOAD MOCK DATA
        ====================================== */

        let reports = [];


        try {

            const response =
                await fetch(
                    "../mock-data/data.json"
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load data."
                );

            }


            const data =
                await response.json();


            reports =
                data.emergencies || [];


        } catch (error) {

            console.error(error);

            reports = [];

        }



        /* =====================================
           ADD CURRENT EMERGENCY
           IF IT EXISTS
        ====================================== */

        const currentRaw =
            sessionStorage.getItem(
                "currentEmergency"
            );


        if (currentRaw) {

            try {

                const current =
                    JSON.parse(
                        currentRaw
                    );


                const exists =
                    reports.some(
                        report =>
                            report.emergency_id ===
                            current.emergency_id
                    );


                if (!exists) {

                    reports.unshift(
                        current
                    );

                }


            } catch (error) {

                console.error(
                    "Invalid current emergency."
                );

            }

        }



        /* =====================================
           REMOVE DUPLICATES
        ====================================== */

        reports =
            reports.filter(
                (report, index, array) =>
                    index ===
                    array.findIndex(
                        item =>
                            item.emergency_id ===
                            report.emergency_id
                    )
            );



        /* =====================================
           SORT
        ====================================== */

        reports.sort(
            (a, b) =>
                new Date(
                    b.created_at || 0
                ) -
                new Date(
                    a.created_at || 0
                )
        );



        /* =====================================
           UPDATE STATS
        ====================================== */

        function updateStats() {

            const total =
                reports.length;


            const active =
                reports.filter(
                    report =>
                        [
                            "active",
                            "dispatched",
                            "processing"
                        ].includes(
                            report.status
                        )
                ).length;


            const resolved =
                reports.filter(
                    report =>
                        report.status ===
                        "resolved"
                ).length;


            document.getElementById(
                "totalReports"
            ).textContent =
                total;


            document.getElementById(
                "activeReports"
            ).textContent =
                active;


            document.getElementById(
                "resolvedReports"
            ).textContent =
                resolved;

        }



        /* =====================================
           RENDER
        ====================================== */

        function renderReports() {

            const search =
                searchInput.value
                    .trim()
                    .toLowerCase();


            const selectedStatus =
                statusFilter.value;


            const filtered =
                reports.filter(
                    report => {

                        const searchable =
                            [
                                report.emergency_id,
                                report.emergency_type,
                                report.description
                            ]
                            .join(" ")
                            .toLowerCase();


                        const matchesSearch =
                            !search ||
                            searchable.includes(
                                search
                            );


                        const matchesStatus =
                            selectedStatus ===
                            "all" ||
                            report.status ===
                            selectedStatus;


                        return (
                            matchesSearch &&
                            matchesStatus
                        );

                    }
                );



            reportsList.innerHTML = "";



            if (
                filtered.length === 0
            ) {

                emptyState.style.display =
                    "block";

                return;

            }


            emptyState.style.display =
                "none";



            filtered.forEach(
                report => {

                    reportsList.insertAdjacentHTML(
                        "beforeend",
                        createReportCard(
                            report
                        )
                    );

                }
            );

        }



        /* =====================================
           CREATE CARD
        ====================================== */

        function createReportCard(
            report
        ) {

            const type =
                report.emergency_type ||
                "Other";


            const icon =
                getEmergencyIcon(
                    type
                );


            const status =
                report.status ||
                "processing";


            const priority =
                report.priority ||
                "medium";


            const description =
                report.description &&
                report.description.trim()
                    ? report.description
                    : "تم إرفاق صورة للحالة دون وصف نصي.";


            const detailsUrl =
                `details.html?id=${encodeURIComponent(
                    report.emergency_id || ""
                )}`;


            const trackingUrl =
                `tracking.html?id=${encodeURIComponent(
                    report.emergency_id || ""
                )}`;


            const canTrack =
                [
                    "active",
                    "dispatched",
                    "processing"
                ].includes(
                    status
                );


            return `

                <article class="report-card">


                    <div class="report-icon">

                        ${icon}

                    </div>


                    <div class="report-main">


                        <div class="report-top">

                            <span class="report-type">

                                ${escapeHtml(
                                    type
                                )}

                            </span>


                            <span class="report-id">

                                ${escapeHtml(
                                    report.emergency_id
                                )}

                            </span>

                        </div>


                        <div class="report-description">

                            ${escapeHtml(
                                description
                            )}

                        </div>


                        <div class="report-date">

                            ${formatDate(
                                report.created_at
                            )}

                        </div>

                    </div>


                    <div class="report-meta">

                        <span
                            class="
                                status-badge
                                status-${escapeHtml(
                                    status
                                )}
                            "
                        >

                            ${getStatusText(
                                status
                            )}

                        </span>


                        <span
                            class="
                                priority-badge
                                priority-${escapeHtml(
                                    priority
                                )}
                            "
                        >

                            ${getPriorityText(
                                priority
                            )}

                        </span>

                    </div>


                    <div class="report-actions">

                        <a
                            href="${detailsUrl}"
                            class="
                                report-btn
                                details-btn
                            "
                        >
                            التفاصيل
                        </a>


                        ${
                            canTrack
                                ? `
                                    <a
                                        href="${trackingUrl}"
                                        class="
                                            report-btn
                                            track-btn
                                        "
                                    >
                                        تتبع الفريق
                                    </a>
                                  `
                                : ""
                        }

                    </div>

                </article>

            `;

        }



        /* =====================================
           EVENTS
        ====================================== */

        searchInput.addEventListener(
            "input",
            renderReports
        );


        statusFilter.addEventListener(
            "change",
            renderReports
        );



        /* =====================================
           INITIAL RENDER
        ====================================== */

        updateStats();

        renderReports();

    }
);


/* =========================================
   HELPERS
========================================= */


function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    );

}


function getEmergencyIcon(
    type
) {

    const icons = {

        "Fire": "FR",

        "Flood": "FL",

        "Earthquake": "EQ",

        "Traffic Accident": "TA",

        "Medical Emergency": "+",

        "Other": "!"

    };


    return (
        icons[type] ||
        "!"
    );

}


function getStatusText(
    status
) {

    const statuses = {

        "active":
            "نشط",

        "dispatched":
            "تم توجيه الفريق",

        "resolved":
            "مكتمل",

        "processing":
            "قيد المعالجة"

    };


    return (
        statuses[status] ||
        "غير معروف"
    );

}


function getPriorityText(
    priority
) {

    const priorities = {

        "critical":
            "حرج",

        "high":
            "مرتفع",

        "medium":
            "متوسط",

        "low":
            "منخفض"

    };


    return (
        priorities[priority] ||
        "متوسط"
    );

}


function formatDate(
    value
) {

    if (!value) {

        return "وقت غير متوفر";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return String(value);

    }


    return date.toLocaleString(
        "ar-SA",
        {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}

</script>


</body>

</html>
